<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Lexend+Deca:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Young+Serif&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Profile card component</title>

  <link rel="stylesheet" href="/style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    /* .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); } */
  </style>
</head>
<body>

<main>
  <section class="main-box">
    <div class="sec1"></div>
    <div class="sec2">
        <img src="/images/bg-pattern-card.svg" alt="">
    </div>
      <div class="cont-box">
      <img src="/images/image-victor.jpg" alt="">
      <div class="name">
        <h2>Victor Crest</h2>
        <p>26</p>
      </div>
      <p class="lon">London</p>
    
      <div class="num">
        <div class="fl">
          <h5>80K</h5>
          <p>Followers</p>
        </div>
        <div class="li">
          <h5>803K</h5>
          <p>Likes</p>
        </div>
        <div class="ph">
          <h5>1.4K</h5> 
          <p class="ph">Photos</p>
        </div>
      </div>
    </div>
  </section>
</main>
